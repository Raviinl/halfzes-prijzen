name: Prijzen verversen

on:
  schedule:
    # Elke dag om 07:30 UTC; Checkjebon ververst zijn bestand vroeg in de ochtend.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ververs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prijzen ophalen
        run: node ververs.mjs
      - name: Vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prijzen.json
          git diff --cached --quiet || git commit -m "Prijzen van $(date -u +%F)"
          git push
